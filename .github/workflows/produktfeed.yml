name: Produktfeed aktualisieren

# Haelt feed.xml automatisch synchron mit dem Shop-Bestand.
# Ohne das laeuft der Feed auseinander: Google bewirbt dann verkaufte Ware
# und kennt neue Inserate nicht.

on:
  push:
    branches: [main]
    paths:
      - 'data/shop-produkte.json'
      - '.github/scripts/**'
      - '.github/workflows/produktfeed.yml'
  schedule:
    # Taeglich 04:15 UTC als Sicherheitsnetz, falls ein Push den Pfadfilter umgeht.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: produktfeed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        working-directory: .github/scripts
        run: |
          python3 test_google_feed.py
          python3 test_local_inventory.py

      - name: Feed erzeugen und committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Der Shop-Editor committet laufend. Zwischen Erzeugen und Push kann
          # main also weiterwandern und der Push abprallen. Darum bis zu fuenf
          # Versuche, jedes Mal vom frischen Stand neu erzeugt - so entstehen
          # keine Konflikte und der Feed bleibt in jedem Fall aktuell.
          for versuch in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 .github/scripts/json_to_google_feed.py
            python3 .github/scripts/json_to_local_inventory.py

            if git diff --quiet -- feed.xml local-inventory.xml; then
              echo "Feeds unveraendert - nichts zu tun"
              exit 0
            fi

            git add feed.xml local-inventory.xml
            git commit -m "Produktfeed aktualisiert"

            if git push; then
              echo "Feed aktualisiert (Versuch $versuch)"
              exit 0
            fi

            echo "Push kollidiert - main ist weitergewandert, neuer Versuch"
            sleep $((versuch * 5))
          done

          echo "Feed konnte nach fuenf Versuchen nicht gepusht werden"
          exit 1
